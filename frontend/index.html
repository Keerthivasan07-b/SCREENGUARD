<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenGuard — Faculty Dashboard</title>
    <meta name="description" content="Real-time AI-powered classroom desktop monitoring dashboard for faculty">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">ScreenGuard</span>
            </div>
            <span class="topbar-divider"></span>
            <span class="topbar-subtitle">Faculty Dashboard</span>
        </div>
        <div class="topbar-center">
            <div class="connection-status" id="connectionStatus">
                <span class="status-dot disconnected"></span>
                <span class="status-label">Disconnected</span>
            </div>
        </div>
        <div class="topbar-right">
            <div class="stat-badge" id="statStudents">
                <span class="stat-icon">👤</span>
                <span class="stat-value" id="studentCount">0</span>
                <span class="stat-label">Students</span>
            </div>
            <div class="stat-badge" id="statAlerts">
                <span class="stat-icon">⚠️</span>
                <span class="stat-value" id="alertCount">0</span>
                <span class="stat-label">Alerts</span>
            </div>
            <div class="stat-badge" id="statFps">
                <span class="stat-icon">🎞️</span>
                <span class="stat-value" id="avgFps">0</span>
                <span class="stat-label">Avg FPS</span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Left: Student Grid -->
        <section class="grid-section">
            <div class="grid-header">
                <h1>Live Monitoring</h1>
                <div class="grid-controls">
                    <input type="text" id="searchInput" class="search-box" placeholder="🔍 Search student...">
                    <select id="gridSize" class="grid-select">
                        <option value="3">3 Columns</option>
                        <option value="4" selected>4 Columns</option>
                        <option value="5">5 Columns</option>
                        <option value="6">6 Columns</option>
                    </select>
                </div>
            </div>
            <div class="student-grid" id="studentGrid">
                <div class="empty-state" id="emptyState">
                    <div class="empty-icon">📡</div>
                    <h2>Waiting for students to connect...</h2>
                    <p>Student agents will appear here once they connect to the backend.</p>
                </div>
            </div>
        </section>

        <!-- Right: Alerts Sidebar -->
        <aside class="alerts-sidebar" id="alertsSidebar">
            <div class="sidebar-header">
                <h2>🚨 Alerts</h2>
                <button class="clear-btn" id="clearAlerts">Clear All</button>
            </div>
            <div class="alerts-list" id="alertsList">
                <div class="no-alerts" id="noAlerts">
                    <span>✅</span>
                    <p>No alerts yet</p>
                </div>
            </div>
        </aside>
    </main>

    <!-- Popout Overlay (Multi-Screen Parallel View) -->
    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <div class="fullscreen-header">
            <div class="fullscreen-info">
                <span class="fullscreen-title">🚨 Pop-Out Live Monitor</span>
                <span class="popout-count-badge" id="popoutCountBadge">0 Active Screens</span>
            </div>
            <div class="fullscreen-actions">
                <button class="clear-btn" id="popoutCloseAll" style="margin-right: 12px; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); color: #fff;">Close All</button>
                <button class="fullscreen-close" id="fullscreenClose" title="Close Overlay">✕</button>
            </div>
        </div>
        <div class="popout-content" id="popoutContainer">
            <!-- Dynamic parallel popout cards rendered here -->
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-modal">
            <h2>⚙️ Connection Settings</h2>
            <div class="settings-field">
                <label for="backendUrl">Backend WebSocket URL</label>
                <input type="text" id="backendUrl" value="ws://localhost:8000/ws" placeholder="ws://IP:PORT/ws">
            </div>
            <div class="settings-field">
                <label for="authToken">Faculty Auth Token</label>
                <input type="text" id="authToken" value="faculty-secret" placeholder="Auth token">
            </div>
            <div class="settings-actions">
                <button class="btn-secondary" id="settingsCancel">Cancel</button>
                <button class="btn-primary" id="settingsConnect">Connect</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
